<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mermaid Diagram Viewer</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <div id="loading">
      <div class="spinner"></div>
      <span>Waiting for Mermaid diagram…</span>
    </div>

    <div id="main-area">
      <!-- Editor panel (shown when source is toggled) -->
      <div id="editor-panel">
        <div id="editor-header">
          <span>Mermaid Source</span>
          <div id="editor-actions">
            <button id="btn-copy-source" title="Copy Source"></button>
            <button id="btn-toggle-layout" title="Toggle Layout"></button>
          </div>
        </div>
        <textarea id="source-editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      </div>

      <!-- Draggable divider -->
      <div id="split-divider">
        <div id="split-divider-handle"></div>
      </div>

      <!-- Diagram panel -->
      <div id="diagram-container">
        <div id="diagram-inner"></div>
        <div class="toolbar" id="toolbar">
          <button id="btn-zoom-in" title="Zoom In"></button>
          <button id="btn-zoom-out" title="Zoom Out"></button>
          <button id="btn-reset" title="Reset View"></button>
          <button id="btn-copy-svg" title="Copy SVG"></button>
          <button id="toggle-source" title="Source"></button>
        </div>
      </div>
    </div>

    <div id="error"></div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
