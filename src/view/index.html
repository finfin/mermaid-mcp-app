<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mermaid Diagram Viewer</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <div id="loading">
      <div class="spinner"></div>
      <span>Waiting for Mermaid diagram…</span>
    </div>

    <div id="diagram-container">
      <div id="diagram-inner"></div>
      <div class="toolbar" id="toolbar">
        <button id="btn-zoom-in" title="Zoom In"></button>
        <button id="btn-zoom-out" title="Zoom Out"></button>
        <button id="btn-reset" title="Reset View"></button>
        <button id="btn-copy-svg" title="Copy SVG"></button>
        <button id="toggle-source" title="Source"></button>
      </div>
    </div>

    <div id="error"></div>
  </div>

  <!-- Source modal (outside #app to avoid overflow clipping) -->
  <div id="source-modal">
    <div id="source-modal-dialog">
      <div id="source-modal-header">
        <span>Mermaid Source</span>
        <button id="btn-close-modal" title="Close">✕</button>
      </div>
      <pre id="source-code"></pre>
      <div id="source-modal-footer">
        <button id="btn-copy-source" title="Copy Source"></button>
      </div>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
