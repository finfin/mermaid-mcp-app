<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mermaid Diagram Viewer</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <div id="loading">
      <div class="spinner"></div>
      <span>Waiting for Mermaid diagram…</span>
    </div>

    <div id="main-area">
      <!-- Diagram panel -->
      <div id="diagram-container">
        <div id="diagram-inner"></div>
        <div class="toolbar" id="toolbar">
          <button id="btn-zoom-in" title="Zoom In"></button>
          <button id="btn-zoom-out" title="Zoom Out"></button>
          <button id="btn-reset" title="Reset View"></button>
          <button id="btn-copy-svg" title="Copy SVG"></button>
        </div>
      </div>

      <!-- Draggable divider -->
      <div id="split-divider" class="is-visible">
        <div id="split-divider-handle"></div>
      </div>

      <!-- Editor panel (source) -->
      <div id="editor-panel" class="is-visible">
        <div id="editor-collapsed-bar">
          <span>Source</span>
          <div id="collapsed-actions">
            <button id="btn-copy-source-c" title="Copy Source"></button>
            <button id="btn-send-to-ai-c" title="Send to AI (⌘↵)"></button>
            <button id="btn-vertical-split" title="Vertical Split"></button>
            <button id="btn-horizontal-split" title="Horizontal Split"></button>
          </div>
        </div>
        <div id="editor-body">
          <div id="editor-actions">
            <button id="btn-copy-source" title="Copy Source"></button>
            <button id="btn-send-to-ai" title="Send to AI (⌘↵)"></button>
            <button id="btn-toggle-layout" title="Horizontal Split"></button>
            <button id="btn-minimize-editor" title="Minimize"></button>
          </div>
          <textarea id="source-editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
        </div>
      </div>
    </div>
    </div>

    <div id="error"></div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
